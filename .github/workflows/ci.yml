name: CI

on:
  push:
    branches: [main, hardening, alarm-reliability-qol]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # This branch needs SDK changes that are not published yet. The patch is
      # not committed, so remove this step when they are.
      - name: Build against the SDK branch
        uses: ./.github/actions/sdk-branch
      - uses: Swatinem/rust-cache@v2
      - name: Dioxus desktop build deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  android:
    name: android cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Build against the SDK branch
        uses: ./.github/actions/sdk-branch
      - uses: Swatinem/rust-cache@v2
      # rusqlite's bundled SQLite is C, so the build script needs the NDK's
      # clang. The ubuntu runner ships an NDK; API 26 matches minSdk.
      - name: Point cc at the preinstalled NDK
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$BIN/aarch64-linux-android26-clang"
          echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo check --target aarch64-linux-android
      - run: cargo clippy --target aarch64-linux-android -- -D warnings
