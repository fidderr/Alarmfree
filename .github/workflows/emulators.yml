name: Emulators

# The device suite (devtest/, the same full list that EVERYWHERE=1 runs on the owner's PC) on GitHub's machines, one
# Android version per machine, all at once. Start it: Actions > Emulators > Run workflow, or
# `gh workflow run emulators.yml --ref <branch> -f version=all`. A push to ci-emulators also runs it: one version
# (afg15), or those named in the commit message as `[avds: afg14 msd29]` or `[avds: all]`. A version can carry options
# joined by +: `msd30+default` (AOSP image without Google APIs), `afg15+c2` (2 emulator cores). See devtest/CI.md.
# A push to devtest-no-flake runs it the same way. Only some scenarios: the input `scenarios`, or `[only: s50 s53]` in the commit
# message. Sabotage mode (touches dropped and steps delayed on purpose, devtest/chaos.sh): the input `chaos`, or `[chaos]`.
# A full run is two parts per version (16 jobs for eight versions, each part on a fresh emulator; devtest/ci/split.py balances them by
# the expected seconds); a run of only some scenarios is one part. The last job merges the parts into one table per version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: One Android version (AVD name) or all
        type: choice
        default: all
        options: [all, afg17, afg16, afg15, afg14, afg13, afg12, msd30, msd29]
      scenarios:
        description: Only these scenarios, names with spaces between (empty means all)
        type: string
        default: ''
      chaos:
        description: Sabotage mode, touches dropped and steps delayed on purpose
        type: choice
        default: 'no'
        options: ['no', 'yes']
  # noflake/<name>: a long run of its own (a baseline, a proof round) that later pushes to devtest-no-flake do not replace.
  push:
    branches: [ci-emulators, devtest-no-flake, 'noflake/**']

# A newer push to the same branch replaces its older run.
concurrency:
  group: emulators-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-slim
    outputs:
      avds: ${{ steps.pick.outputs.avds }}
      scenarios: ${{ steps.pick.outputs.scenarios }}
      chaos: ${{ steps.pick.outputs.chaos }}
      parts: ${{ steps.pick.outputs.parts }}
      nparts: ${{ steps.pick.outputs.nparts }}
    steps:
      - id: pick
        env:
          INPUT: ${{ inputs.version }}
          INPUT_SCENARIOS: ${{ inputs.scenarios }}
          INPUT_CHAOS: ${{ inputs.chaos }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          all="afg17 afg16 afg15 afg14 afg13 afg12 msd30 msd29"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then want=$INPUT
          else want=$(printf '%s' "$MSG" | sed -n 's/.*\[avds: *\([^]]*\)\].*/\1/p' | head -1); fi
          [ -n "$want" ] || want=afg15
          [ "$want" = all ] && want=$all
          # A version is a name from the list and options joined by +, letters and digits only: what follows it in a commit
          # message is not passed on (the job steps below paste the name into a command line).
          json=$(for a in $want; do case "$a" in *[!a-z0-9+]*) continue ;; esac; case " $all " in *" ${a%%+*} "*) printf '"%s",' "$a" ;; esac; done)
          echo "avds=[${json%,}]" >> "$GITHUB_OUTPUT"
          echo "AVDs: $want"
          # Scenario names are letters, digits and underscores: anything else is dropped before it reaches a command line.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              only=$INPUT_SCENARIOS
              [ "$INPUT_CHAOS" = yes ] && chaos=1 || chaos=""
          else
              only=$(printf '%s' "$MSG" | sed -n 's/.*\[only: *\([^]]*\)\].*/\1/p' | head -1)
              case "$MSG" in *"[chaos]"*) chaos=1 ;; *) chaos="" ;; esac
          fi
          only=$(printf '%s' "$only" | tr -c 'A-Za-z0-9_' ' ' | tr -s ' ' | sed 's/^ //; s/ $//')
          # [only: ...] that gives no name (a typo, a missing bracket) must not turn into a run of everything.
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ -z "$only" ]; then
              case "$MSG" in *"[only:"*) echo "::error::the commit message has [only: ...] but no scenario name was read from it"; exit 1 ;; esac
          fi
          echo "scenarios=$only" >> "$GITHUB_OUTPUT"
          # Two parts of the full list; the scenarios of an [only: ...] run are one part.
          if [ -n "$only" ]; then
              echo 'parts=["1"]' >> "$GITHUB_OUTPUT"; echo "nparts=1" >> "$GITHUB_OUTPUT"
          else
              echo 'parts=["1","2"]' >> "$GITHUB_OUTPUT"; echo "nparts=2" >> "$GITHUB_OUTPUT"
          fi
          echo "chaos=$chaos" >> "$GITHUB_OUTPUT"
          echo "Scenarios: ${only:-all}   Sabotage: ${chaos:-off}"

  build:
    name: x86_64 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: Alarmfree
      # build.sh finds the SDK's build tool at ../mobile-sentinel.
      - uses: actions/checkout@v5
        with:
          repository: fidderr/mobile-sentinel
          ref: v0.7.1
          path: mobile-sentinel
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      # sdk-patches/*.patch: changes to the SDK that are tried here before they are made in its own repo. They are part of the
      # app's files, so they are part of the key of the APK below.
      - name: Patch the SDK
        run: |
          for p in Alarmfree/sdk-patches/*.patch; do
              [ -e "$p" ] || continue
              echo "Applying $p to the SDK checkout"
              git -C mobile-sentinel apply --whitespace=nowarn "$(realpath "$p")"
          done
      # The built APK is kept in the cache under a key of everything it is built from, so a run that changed only test
      # scripts skips the build. The key holds: every file of the app except devtest/, docs/, store/, .github/ and .git
      # (source, ui, assets, build.rs, Cargo.toml, Cargo.lock, build.sh, sentinel.toml, .cargo/), the commit of the SDK that
      # is checked out, the Rust compiler version, the runner image version (NDK, JDK, Gradle) and APK_CACHE_VERSION: bump it
      # when the Build step below changes. Anything else that changes the APK is a changed key and builds.
      - name: Key of the APK
        id: apk
        env:
          SRC_HASH: ${{ hashFiles('Alarmfree/**', 'Alarmfree/.cargo/**', '!Alarmfree/.git/**', '!Alarmfree/.github/**', '!Alarmfree/devtest/**', '!Alarmfree/docs/**', '!Alarmfree/store/**') }}
          APK_CACHE_VERSION: '1'
        run: |
          sdk=$(git -C mobile-sentinel rev-parse HEAD)
          rustc_version=$(rustc --version | tr -c 'A-Za-z0-9.\n' '-')
          if [ -z "$SRC_HASH" ] || [ -z "$sdk" ] || [ -z "$rustc_version" ]; then
              echo "::error::could not make the key of the APK"
              exit 1
          fi
          echo "key=apk-v$APK_CACHE_VERSION-$sdk-$rustc_version-${ImageVersion:-noimage}-$SRC_HASH" >> "$GITHUB_OUTPUT"
      - id: apk-cache
        uses: actions/cache@v6
        with:
          path: Alarmfree/build/alarmfree-slint-debug.apk
          key: ${{ steps.apk.outputs.key }}
      - name: The APK came from
        env:
          HIT: ${{ steps.apk-cache.outputs.cache-hit }}
          KEY: ${{ steps.apk.outputs.key }}
        run: |
          if [ "$HIT" = true ]; then what="the cache (no build)"; else what="a new build"; fi
          echo "APK: $what"
          {
              echo "### APK"
              echo "From $what."
              echo "Key: \`$KEY\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Alarmfree
            mobile-sentinel
      # The runner image has NDK 30 (build.sh wants exactly 30.0.16248370) and JDK 17 as the default.
      - name: Build
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: Alarmfree
        run: |
          test -d "$ANDROID_HOME/ndk/30.0.16248370" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"
          # build_sentinel starts the generated project's relative "target/sentinel-android/gradlew" with that folder as its
          # working directory, which only resolves on Linux with this link (SDK 0.7.0 bug, reported in devtest/CI.md).
          mkdir -p target/sentinel-android/target && ln -sfn .. target/sentinel-android/target/sentinel-android
          TARGET=x86_64-linux-android bash ./build.sh
      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: Alarmfree/build/alarmfree-slint-debug.apk
          retention-days: 3

  suite:
    name: ${{ matrix.avd }} ${{ matrix.part }}/${{ needs.plan.outputs.nparts }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        avd: ${{ fromJSON(needs.plan.outputs.avds) }}
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: apk
          path: build
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      # The suite calls `python` and uses Pillow for one picture comparison.
      - name: Tools
        run: |
          sudo ln -sf "$(command -v python3)" /usr/local/bin/python
          python3 -c 'import PIL' 2> /dev/null || sudo apt-get install -y python3-pil
          sudo apt-get install -y sqlite3 > /dev/null || true
      - name: Android image and AVD
        run: bash devtest/ci/make_avd.sh ${{ matrix.avd }}
      - name: Suite
        env:
          SCENARIOS: ${{ needs.plan.outputs.scenarios }}
          CHAOS: ${{ needs.plan.outputs.chaos }}
          PART: ${{ matrix.part }}/${{ needs.plan.outputs.nparts }}
        run: |
          # Host load every 15 s next to the suite: tells a starved machine from a failing app.
          (while :; do echo "$(date +%T) $(cut -d' ' -f1-3 /proc/loadavg) $(awk '/MemAvailable/{print $2/1024" MB free"}' /proc/meminfo)"; sleep 15; done > host_load.txt) &
          bash devtest/ci/run.sh ${{ matrix.avd }}
      - name: Pack the results
        if: always()
        run: |
          mkdir -p packed
          tar czf "packed/${{ matrix.avd }}-${{ matrix.part }}.tgz" host_load.txt devtest-out ~/.android/avd/${{ matrix.avd }}.avd/config.ini 2> /dev/null || true
          ls -l packed
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: results-${{ matrix.avd }}-${{ matrix.part }}
          path: packed/${{ matrix.avd }}-${{ matrix.part }}.tgz
          retention-days: 3
          compression-level: 0

  # One table per version from its parts, and the lists of FAIL, INFRA and FLAKY over all of them.
  summary:
    name: summary
    needs: [plan, suite]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: results-*
          path: parts
      - name: Merge
        run: |
          mkdir -p merged
          for t in parts/*/*.tgz; do
              [ -e "$t" ] || continue
              n=$(basename "$t" .tgz)
              mkdir -p "merged/$n"
              tar xzf "$t" -C "merged/$n" --wildcards '*/results.txt' '*/ci_*.summary.md' 2> /dev/null || true
          done
          bash devtest/ci/merge.sh merged ${{ needs.plan.outputs.nparts }} | tee -a "$GITHUB_STEP_SUMMARY"
