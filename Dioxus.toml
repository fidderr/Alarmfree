[application]
name = "alarmfree"
default_platform = "android"
asset_dir = "assets"

[application.android]
min_sdk_version = 26
target_sdk_version = 36

[android]
min_sdk = 26
target_sdk = 36
compile_sdk = 36
version_code = 12352   # Must be > any versionCode ever uploaded for com.fidderr.alarmfree (12351 was rejected: targetSdk 35).
# Bump by at least 1 for every Play upload. (Derivation from the Cargo version
# would give 0.2.1 -> 201, below codes already used, so keep this pin.)
# versionName comes from Cargo.toml (0.2.1).

[bundle]
identifier = "com.fidderr.alarmfree"
