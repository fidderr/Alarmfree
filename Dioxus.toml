[application]
name = "alarmfree"
default_platform = "android"
asset_dir = "assets"

[application.android]
min_sdk_version = 26
target_sdk_version = 35

[android]
min_sdk = 26
target_sdk = 35
compile_sdk = 35
version_code = 12346   # Must be > any previously used (12345 is currently active in console). 
# For next release just change this to 12347 (or higher). 
# You can comment it out later and rely on Cargo version derivation if you prefer.
# This keeps versionName=0.1.2 while satisfying Play's increasing versionCode rule.

[bundle]
identifier = "com.fidderr.alarmfree"
