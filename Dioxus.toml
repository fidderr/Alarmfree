[application]
name = "alarmfree"
default_platform = "android"
asset_dir = "assets"

[application.android]
min_sdk_version = 26
target_sdk_version = 35

[android]
min_sdk = 26
target_sdk = 35
compile_sdk = 35
version_code = 12351   # Must be > any versionCode ever uploaded for com.fidderr.alarmfree (Play had 12350 = 0.1.6).
# Bump by at least 1 for every Play upload. (Derivation from the Cargo version
# would give 0.2.1 -> 201, below codes already used, so keep this pin.)
# versionName comes from Cargo.toml (0.2.1).

[bundle]
identifier = "com.fidderr.alarmfree"
