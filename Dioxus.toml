[application]
name = "alarmfree"
default_platform = "android"
asset_dir = "assets"

[application.android]
min_sdk_version = 31
target_sdk_version = 36

[android]
min_sdk = 31
target_sdk = 36
compile_sdk = 36
version_code = 12354   # Must be > any versionCode ever uploaded for com.fidderr.alarmfree (12352 was 0.2.1; 12353 was never uploaded).
# Bump by at least 1 for every Play upload. (Derivation from the Cargo version
# would give 0.3.1 -> 301, below codes already used, so keep this pin.)
# versionName comes from Cargo.toml (0.3.1).

[bundle]
identifier = "com.fidderr.alarmfree"
