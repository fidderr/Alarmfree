# s38: the accent colour and the name of an own sound.
# Set before by run.sh: an alarm at 7:00 and the own sound mytune.ogg. Checked after: the saved prefs.
appId: com.fidderr.alarmfree
---
- launchApp
- tapOn: "Settings"
- tapOn: "Theme.*"
- scrollUntilVisible:
    element: "Purple"
    centerElement: true
- tapOn: "Purple"
- stopApp
- launchApp
- tapOn: "7:00 AM a.*"
- tapOn: "Sound.*"
- scrollUntilVisible:
    element: "mytune"
    centerElement: true
- tapOn: "Rename this sound"
# Slint puts the cursor at the start, and eraseText deletes backwards: a tap at the end first.
- tapOn:
    text: "mytune"
    point: 95%,50%
- eraseText: 20
- inputText: "Morning"
- tapOn:
    text: "Done"
    index: 0
