# s50: everything of an alarm, set through the screens, then shown again and deleted.
# Needs a build with the setup done; nothing else (no seed, no sql), so a release build runs it too.
# Not in the flow: the volume slider (Maestro cannot set a slider).
appId: com.fidderr.alarmfree
---
- launchApp
- tapOn: "Create new alarm"
- tapOn: "+5"
- tapOn: "+5"
- tapOn: "Weekend"
- tapOn: "Label.*"
- tapOn: "Name"
- inputText: "Morning"
- tapOn: "A note for when it rings"
- inputText: "Take pills"
- tapOn: "Done"
- tapOn: "Sound.*"
- tapOn: "Funk"
- scrollUntilVisible:
    element: "2 min"
    centerElement: true
- tapOn: "2 min"
- tapOn: "Done"
- tapOn: "Vibration.*"
- tapOn: "Steady"
- tapOn: "15 s"
- tapOn: "Done"
- tapOn: "Snooze.*"
# The snooze sheet is short and does not scroll: centering would swipe over the dimmed area and close it.
- scrollUntilVisible:
    element: "More How often"
- tapOn: "More How often"
- scrollUntilVisible:
    element: "More How long"
- tapOn: "More How long"
- tapOn: "Done"
- tapOn: "Challenges.*"
- tapOn: "Add a challenge"
- tapOn: "Math"
- runFlow:
    when:
      visible: "Difficulty"
    commands:
      - tapOn: "Done"
- tapOn: "Add a challenge"
- tapOn: "Steps"
# Steps has its own sheet ("How many steps"), and then the list of challenges is still open under it.
- runFlow:
    when:
      visible: "How many steps"
    commands:
      - tapOn: "Done"
- tapOn: "Done"
- scrollUntilVisible:
    element: "Ring limit.*"
    centerElement: true
- tapOn: "Ring limit.*"
- scrollUntilVisible:
    element: "60 min"
    centerElement: true
- tapOn: "60 min"
- tapOn: "Done"
- scrollUntilVisible:
    element: "Are you up.*"
    centerElement: true
- tapOn: "Are you up.*"
- tapOn: ".*3 min"
- tapOn: "Done"
- tapOn: "Reminder.*"
- tapOn: ".*10 min"
- tapOn: "Done"
- scrollUntilVisible:
    element: "Full brightness.*"
    centerElement: true
- tapOn: "Full brightness.*"
- tapOn: "Save"
# Saved: the card shows it, and the editor shows it again.
- assertVisible: "7:10 AM.*Morning.*"
- tapOn: "7:10 AM.*Morning.*"
- assertVisible: "Time: 7:10 AM"
- assertVisible: "Label Morning"
- assertVisible: "Sound Funk"
- assertVisible: "Vibration Steady"
- assertVisible: "Snooze 6 min, 4.*"
- assertVisible: "Challenges.*Math.*"
- scrollUntilVisible:
    element: "Ring limit 60 min"
    centerElement: true
- assertVisible: "Are you up.*3 min"
- assertVisible: "Reminder 10 min before"
# Off the list from here too, after asking.
- scrollUntilVisible:
    element: "Delete alarm"
    centerElement: true
    direction: UP
- tapOn: "Delete alarm"
- tapOn: "Delete"
- assertVisible: "No alarms yet"
