[package]
name = "alarmfree"
version = "0.7.1"
edition = "2021"
rust-version = "1.80.0"
description = "Free, ad-free mobile alarm clock with challenge-based dismissal"
license = "MIT"
authors = ["fidderr"]
repository = "https://github.com/fidderr/alarmfree"

[lib]
name = "alarmfree"
path = "src/lib.rs"
# The phone loads the cdylib (libalarmfree.so, a NativeActivity); the tests and the desktop
# binary use the rlib.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "alarmfree"
path = "src/main.rs"

[dependencies]
mobile-sentinel = { version = "0.7.1", features = ["alarm-kit", "scanner", "haptics", "home_widget", "battery", "audio", "overlay", "permissions", "sensors", "foregrounding", "media_picker", "display", "share"]}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }

# The UI is Slint, drawn on the GPU by Skia: no WebView. Android hosts it in a NativeActivity.
[target.'cfg(target_os = "android")'.dependencies]
slint = { git = "https://github.com/fidderr/slint", rev = "32622024be7e44c92c6809287693ea2cfcb5a1bf", default-features = false, features = ["std", "compat-1-20", "system-fonts", "backend-android-activity-06", "renderer-skia", "accessibility"] }

[dependencies.i-slint-core]
git = "https://github.com/fidderr/slint"
rev = "32622024be7e44c92c6809287693ea2cfcb5a1bf"
optional = true
default-features = false
features = ["std"]

[dependencies.i-slint-backend-testing]
git = "https://github.com/fidderr/slint"
rev = "32622024be7e44c92c6809287693ea2cfcb5a1bf"
optional = true
default-features = false

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { git = "https://github.com/fidderr/slint", rev = "32622024be7e44c92c6809287693ea2cfcb5a1bf" }

[build-dependencies]
slint-build = { git = "https://github.com/fidderr/slint", rev = "32622024be7e44c92c6809287693ea2cfcb5a1bf" }

[features]
default = []
# What devtest/ needs to look at the Slint elements (src/ui/debug_elements.rs). Debug builds made by
# ./build.sh only: never in a release.
devtest = ["dep:i-slint-backend-testing", "dep:i-slint-core"]

# Release builds. Size-first: the .so is the biggest thing users download. No `strip` here: the Android Gradle
# plugin strips the shipped .so and keeps symbols for Play crash reports.
# `panic = "abort"`: -1.9 MB of unwind tables, and a panic is a crash with a tombstone, not a silent
# process exit. Nothing here catches a panic (the SDK's wake hook does, and no longer can).
# `lto = "thin"`, not "fat": dx 0.7.10 on Windows writes its linker response
# file with unescaped backslashes, and fat LTO's short argument list hits that
# (clang: "no such file C:GitAlarmfree..."). Thin LTO links and keeps most of
# the gain (libmain.so 33.8 MB -> 21.2 MB).
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"

# The edit-and-run loop (`./build.sh fast`): no LTO, 16 codegen units, incremental. One changed file
# builds in about 12 s instead of 170 s, and the .so is 27 MB instead of 16. Never for shipping.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[dev-dependencies]
i-slint-backend-testing = { git = "https://github.com/fidderr/slint", rev = "32622024be7e44c92c6809287693ea2cfcb5a1bf", default-features = false }
i-slint-core = { git = "https://github.com/fidderr/slint", rev = "32622024be7e44c92c6809287693ea2cfcb5a1bf", default-features = false, features = ["std", "accessibility-text"] }
accesskit = "0.25"
tempfile = "3"
proptest = "1"
chrono-tz = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[patch.crates-io]
# The SDK's Rust side of the android9 branch (share::downloads_permission_missing, health::HealthReport::applies): the Kotlin side comes from the checkout beside this folder. Until the next SDK release is on crates.io.
mobile-sentinel = { git = "https://github.com/fidderr/mobile-sentinel", rev = "6513c94ca39a4a2f5203f2a41b67127548393a20" }
accesskit = { git = "https://github.com/fidderr/accesskit", rev = "f835f773c9259d3f71c8018810a96317465b5770" }
accesskit_consumer = { git = "https://github.com/fidderr/accesskit", rev = "f835f773c9259d3f71c8018810a96317465b5770" }
accesskit_android = { git = "https://github.com/fidderr/accesskit", rev = "f835f773c9259d3f71c8018810a96317465b5770" }

# The headless UI tests (src/ui/panel_tests.rs) read the element tree thousands of times: optimized
# Slint internals make that about 5x quicker, and they are only built once.
[profile.dev.package.i-slint-core]
opt-level = 2
[profile.dev.package.i-slint-backend-testing]
opt-level = 2

