[package]
name = "alarmfree"
version = "0.4.1"
edition = "2021"
rust-version = "1.80.0"
description = "Free, ad-free mobile alarm clock with challenge-based dismissal"
license = "MIT"
authors = ["fidderr"]
repository = "https://github.com/fidderr/alarmfree"

[lib]
name = "alarmfree"
path = "src/lib.rs"
# The phone loads the cdylib (libalarmfree.so, a NativeActivity); the tests and the desktop
# binary use the rlib.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "alarmfree"
path = "src/main.rs"

[dependencies]
mobile-sentinel = { path = "../vp-work/ms-native", features = ["alarm-kit", "scanner", "haptics", "home_widget", "battery", "audio", "overlay", "permissions", "sensors", "foregrounding", "media_picker", "display", "share"]}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }

# The UI is Slint, drawn on the GPU by Skia: no WebView. Android hosts it in a NativeActivity.
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "renderer-skia"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "=1.18.1" }

[build-dependencies]
slint-build = "=1.18.1"

[features]
default = []

# Release builds. Size-first: the .so is the biggest thing users download. No `strip` here: the Android Gradle
# plugin strips the shipped .so and keeps symbols for Play crash reports. No
# `panic = "abort"`: a panic would turn into a silent process exit.
# `lto = "thin"`, not "fat": dx 0.7.10 on Windows writes its linker response
# file with unescaped backslashes, and fat LTO's short argument list hits that
# (clang: "no such file C:GitAlarmfree..."). Thin LTO links and keeps most of
# the gain (libmain.so 33.8 MB -> 21.2 MB).
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
