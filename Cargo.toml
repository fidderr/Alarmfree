[package]
name = "alarmfree"
version = "0.4.1"
edition = "2021"
rust-version = "1.80.0"
description = "Free, ad-free mobile alarm clock with challenge-based dismissal"
license = "MIT"
authors = ["fidderr"]
repository = "https://github.com/fidderr/alarmfree"

[lib]
name = "alarmfree"
path = "src/lib.rs"
# The phone loads the cdylib (libalarmfree.so, a NativeActivity); the tests and the desktop
# binary use the rlib.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "alarmfree"
path = "src/main.rs"

[dependencies]
mobile-sentinel = { path = "../mobile-sentinel", features = ["alarm-kit", "scanner", "haptics", "home_widget", "battery", "audio", "overlay", "permissions", "sensors", "foregrounding", "media_picker", "display", "share"]}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }

# The UI is Slint, drawn on the GPU by Skia: no WebView. Android hosts it in a NativeActivity.
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "renderer-skia"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "=1.18.1" }

# Three tiny edits to Slint 1.18.1, kept in vendor/ (see vendor/README.md): no ICU line-break
# dictionaries and no SVG stack. -5.6 MB of libmain.so. Remove them when Slint has options for it.
[patch.crates-io]
i-slint-core = { path = "vendor/i-slint-core" }
i-slint-renderer-skia = { path = "vendor/i-slint-renderer-skia" }
i-slint-backend-android-activity = { path = "vendor/i-slint-backend-android-activity" }

[build-dependencies]
slint-build = "=1.18.1"

[features]
default = []

# Release builds. Size-first: the .so is the biggest thing users download. No `strip` here: the Android Gradle
# plugin strips the shipped .so and keeps symbols for Play crash reports.
# `panic = "abort"`: -1.9 MB of unwind tables, and a panic is a crash with a tombstone, not a silent
# process exit. Nothing here catches a panic (the SDK's wake hook does, and no longer can).
# `lto = "thin"`, not "fat": dx 0.7.10 on Windows writes its linker response
# file with unescaped backslashes, and fat LTO's short argument list hits that
# (clang: "no such file C:GitAlarmfree..."). Thin LTO links and keeps most of
# the gain (libmain.so 33.8 MB -> 21.2 MB).
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"

# The edit-and-run loop (`./build.sh fast`): no LTO, 16 codegen units, incremental. One changed file
# builds in about 12 s instead of 170 s, and the .so is 27 MB instead of 16. Never for shipping.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
