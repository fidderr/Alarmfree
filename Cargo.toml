[package]
name = "alarmfree"
version = "0.1.2"
edition = "2021"
rust-version = "1.76.0"
description = "Free, ad-free mobile alarm clock with challenge-based dismissal"
license = "MIT"
authors = ["fidderr"]
repository = "https://github.com/fidderr/alarmfree"

[lib]
name = "alarmfree"
path = "src/lib.rs"

[[bin]]
name = "alarmfree"
path = "src/main.rs"

[dependencies]
mobile-sentinel = { version = "0.1.4", features = ["alarm-kit", "scanner", "haptics", "audio", "overlay", "permissions", "sensors", "foregrounding", "media_picker", "display"]}
dioxus = { version = "0.7", features = ["router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
once_cell = "1"
futures-channel = "0.3"
futures-util = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"
jni = "0.21"
libc = "0.2"

[features]
default = []

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
futures = "0.3"
