<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlarmFree</title>
<meta name="description" content="An alarm clock you only stop by solving a challenge. No ads, no tracking, offline, open source.">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #fbfaf8; --text: #1d1d1f; --muted: #5f6368; --accent: #2f6fde; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121315; --text: #ececec; --muted: #a3a7ad; --accent: #7aa7ff; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 16px; text-align: center; }
  img { width: 112px; height: 112px; border-radius: 26px; }
  h1 { font-size: 2.2rem; margin: 16px 0 4px; }
  p { color: var(--muted); }
  a { color: var(--accent); }
  .links a { display: inline-block; margin: 6px 10px; }
</style>
</head>
<body>
<main>
<img src="icon.png" alt="AlarmFree icon">
<h1>AlarmFree</h1>
<p>An alarm clock you only stop by solving a challenge.<br>No ads, no accounts, no tracking. Works offline. Open source.</p>
<p class="links">
<a href="privacy.html">Privacy policy</a>
<a href="https://github.com/fidderr/Alarmfree">Source code</a>
</p>
</main>
</body>
</html>
